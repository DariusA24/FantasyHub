<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · LeagueShelf</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
        background: #ffffff;
        color: #1f2937;
      }
      img { width: 96px; height: 96px; }
      h1 { font-size: 1.25rem; margin: 0; }
      p { margin: 0; color: #6b7280; max-width: 28rem; }
      button {
        margin-top: 0.5rem;
        padding: 0.6rem 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: #f97316;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="LeagueShelf" />
    <h1>You're offline</h1>
    <p>LeagueShelf needs a connection to load live fantasy data. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
